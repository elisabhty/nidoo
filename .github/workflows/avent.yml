name: Avent ElevenLabs (temporaire)
on:
  push:
    branches: [tmp-sons-elevenlabs]
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les icônes des nouveaux jeux depuis ElevenLabs
        run: |
          mkdir -p public/art
          while read -r chemin source sig; do
            [ -z "$chemin" ] && continue
            curl -fsSL -o "$chemin" "https://elevenlabsusercontent.com/database/workspace/bcd9f0312f0b417ca75ab531ee6f24f6/content_generation/content_asset/$source?Expires=1794956400&KeyName=assets-cdn-key-1&Signature=$sig"
            echo "$chemin $(stat -c %s $chemin) octets"
          done < fichiers.txt
      - name: Les garder sur cette branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Calendrier de l'Avent : icônes des jeux téléchargées"
          git push origin HEAD:tmp-sons-elevenlabs
